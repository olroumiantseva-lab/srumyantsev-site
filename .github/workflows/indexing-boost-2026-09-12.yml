name: Indexing boost 2026-09-12

on:
  push:
    paths:
      - '.github/workflows/indexing-boost-2026-09-12.yml'

permissions:
  contents: write

jobs:
  boost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Strengthen pages and internal links
        shell: python
        run: |
          from pathlib import Path
          import re

          today = '2026-09-12'
          display_date = '12 сентября 2026'

          pages = {
            'nastavnichestvo-uchit-drugih-podrabotka/index.html': {
              'old_title': 'Наставничество после 50: как учить нейросетям и заработать на этом',
              'new_title': 'Как учить нейросетям после 50: наставничество и подработка',
              'old_h1': 'Наставничество: как учить других и превратить это в подработку',
              'new_h1': 'Наставничество после 50: как учить нейросетям и превратить это в подработку',
              'summary': 'Если вы уже уверенно пользуетесь нейросетями, начните не с курса и рекламы, а с трёх пробных занятий. Так вы увидите повторяющиеся трудности новичков, соберёте программу и поймёте, за какой результат люди готовы платить.'
            },
            'svoe-delo-posle-50-s-neyrosetyami/index.html': {
              'old_title': 'Своё дело после 50 с нейросетями: что реально работает, а что миф',
              'new_title': 'Как начать своё дело после 50 с помощью нейросетей',
              'old_h1': 'Своё дело после 50 с нейросетями',
              'new_h1': 'Как начать своё дело после 50 с помощью нейросетей',
              'summary': 'Начинайте не с логотипа и сайта, а с одной понятной услуги и первого платящего клиента. Нейросеть ускорит тексты, расчёты и черновики, но спрос, доверие и продажи придётся проверять на реальных людях.'
            },
            'ii-v-poezdke-perevod-menyu-marshrut/index.html': {
              'old_title': 'Нейросеть для путешествий: перевод меню и маршрут',
              'new_title': 'Как использовать нейросеть в поездке: перевод меню, маршрут и офлайн',
              'old_h1': 'ИИ в поездке',
              'new_h1': 'Как использовать нейросеть в поездке: перевод меню, маршрут и офлайн',
              'summary': 'В поездке нейросеть полезна для перевода меню и вывесок, объяснения фраз и сборки маршрута. Но расписания, цены, билеты и правила въезда нужно сверять по официальным источникам, а офлайн-перевод и карты — скачать заранее.'
            },
            'kak-podobrat-film-ili-knigu-s-pomoshchyu-neyroseti/index.html': {
              'old_title': 'Как подобрать фильм или книгу с помощью нейросети',
              'new_title': 'Что посмотреть или почитать: как подобрать фильм или книгу с помощью нейросети',
              'old_h1': 'Как попросить нейросеть подобрать фильм или книгу под настроение',
              'new_h1': 'Что посмотреть или почитать: как подобрать фильм или книгу с помощью нейросети',
              'summary': 'Чтобы получить не список очевидных хитов, а точную подборку, задайте пять ориентиров: формат, настроение, любимые примеры, ограничения и формат ответа. После первой подборки уточняйте направление короткой обратной связью.'
            },
            'kak-podobrat-podarok-s-pomoshchyu-neyroseti/index.html': {
              'old_title': 'Как подобрать подарок с помощью нейросети',
              'new_title': 'Что подарить: как подобрать подарок с помощью нейросети',
              'old_h1': 'Как подобрать подарок с помощью нейросети и не получить список банальностей',
              'new_h1': 'Что подарить: как подобрать подарок с помощью нейросети без банальностей',
              'summary': 'Опишите не только возраст, а самого человека: отношения, интересы, образ жизни, бюджет и то, что точно не подходит. Для каждой идеи просите объяснить, почему подарок уместен и где есть риск промаха.'
            },
          }

          for rel, cfg in pages.items():
              p = Path(rel)
              text = p.read_text(encoding='utf-8-sig')
              text = text.replace(f'<title>{cfg["old_title"]}</title>', f'<title>{cfg["new_title"]}</title>')
              text = text.replace(f'<h1>{cfg["old_h1"]}</h1>', f'<h1>{cfg["new_h1"]}</h1>')
              text = text.replace(cfg['old_title'], cfg['new_title'])
              text = text.replace(cfg['old_h1'], cfg['new_h1'])
              text = re.sub(r'(<meta property="article:modified_time" content=")\d{4}-\d{2}-\d{2}(T00:00:00\+03:00")', rf'\g<1>{today}\2', text)
              text = re.sub(r'("dateModified":")\d{4}-\d{2}-\d{2}("}?)', rf'\g<1>{today}\2', text)
              text = re.sub(r'<small>Опубликовано: [^<]+</small>', f'<small>Обновлено: {display_date}</small>', text, count=1)
              text = re.sub(r'<p class="article-date">Опубликовано: [^<]+</p>', f'<p class="article-date">Обновлено: {display_date}</p>', text, count=1)
              if 'indexing-rework-summary' not in text:
                  block = f'<section class="indexing-rework-summary"><h2>Коротко: что делать</h2><p>{cfg["summary"]}</p></section>\n'
                  text = text.replace('<div class="seo-body">', '<div class="seo-body">\n' + block, 1)
              p.write_text(text, encoding='utf-8')

          # Refresh sitemap dates for all nine Yandex candidates.
          sitemap = Path('sitemap.xml')
          sm = sitemap.read_text(encoding='utf-8')
          slugs = [
            'nastavnichestvo-uchit-drugih-podrabotka',
            'svoe-delo-posle-50-s-neyrosetyami',
            'ii-v-poezdke-perevod-menyu-marshrut',
            'kak-nauchit-blizkogo-polzovatsya-neyrosetyu',
            'kak-podobrat-film-ili-knigu-s-pomoshchyu-neyroseti',
            'kak-podobrat-podarok-s-pomoshchyu-neyroseti',
            'svoya-biblioteka-promptov',
            'lichnaya-sistema-doveriya-neyroseti',
            'uchitsya-s-neyrosetyu-yazyk-professiya-tehnika',
          ]
          for slug in slugs:
              pattern = rf'(<loc>https://srumyantsev\.ru/{re.escape(slug)}/</loc><lastmod>)\d{{4}}-\d{{2}}-\d{{2}}(</lastmod>)'
              sm = re.sub(pattern, rf'\g<1>{today}\2', sm)
          sitemap.write_text(sm, encoding='utf-8')

          # Add incoming contextual links from strong, already indexed guides.
          donors = {
            'neyroseti-posle-45-pervyy-rezultat/index.html': '''<section class="template-section indexation-links"><h2>Куда двигаться дальше</h2><p>Когда базовые задачи уже получаются, можно <a href="/kak-nauchit-blizkogo-polzovatsya-neyrosetyu/">показать нейросеть близкому без перегруза</a>, попробовать <a href="/nastavnichestvo-uchit-drugih-podrabotka/">наставничество как подработку</a> или разобраться, <a href="/svoe-delo-posle-50-s-neyrosetyami/">как использовать ИИ в своём деле после 50</a>.</p></section>''',
            '10-zadach-dlya-chatgpt-na-kazhdyy-den/index.html': '''<section class="template-section indexation-links"><h2>Ещё три бытовые задачи</h2><p>Нейросеть можно использовать, чтобы <a href="/ii-v-poezdke-perevod-menyu-marshrut/">переводить меню и перестраивать маршрут в поездке</a>, <a href="/kak-podobrat-film-ili-knigu-s-pomoshchyu-neyroseti/">подобрать фильм или книгу под настроение</a> и <a href="/kak-podobrat-podarok-s-pomoshchyu-neyroseti/">найти подарок под конкретного человека и бюджет</a>.</p></section>''',
            'kak-razgovarivat-s-ii-chtoby-poluchat-luchshie-otvety/index.html': '''<section class="template-section indexation-links"><h2>Соберите систему работы</h2><p>Хорошие формулировки стоит сохранять в <a href="/svoya-biblioteka-promptov/">свою библиотеку промптов</a>, важные ответы пропускать через <a href="/lichnaya-sistema-doveriya-neyroseti/">личную систему проверки</a>, а для обучения использовать режим, где <a href="/uchitsya-s-neyrosetyu-yazyk-professiya-tehnika/">нейросеть объясняет и проверяет, а не решает за вас</a>.</p></section>''',
          }
          for rel, block in donors.items():
              p = Path(rel)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8-sig')
              if block.split('href="', 1)[1].split('"', 1)[0] in text:
                  continue
              marker = '<aside class="seo-cta">'
              if marker in text:
                  text = text.replace(marker, block + marker, 1)
              elif '</article>' in text:
                  text = text.replace('</article>', block + '</article>', 1)
              p.write_text(text, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "openai-indexing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "seo: strengthen nine Yandex indexing candidates"
          git push
