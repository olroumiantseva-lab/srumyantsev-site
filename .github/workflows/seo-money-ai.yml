name: SEO money AI update
on:
  push:
    branches: [seo-money-ai]
    paths:
      - 'scripts/seo-money-ai.py'
      - '.github/workflows/seo-money-ai.yml'
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-money-ai
      - run: python scripts/seo-money-ai.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kak-razobratsya-s-dengami-tarify-kredity-kommunalka/index.html
          git commit -m 'Усилить SEO гайда о коммуналке и деньгах'
          git push origin seo-money-ai
