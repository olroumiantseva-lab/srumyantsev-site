name: Answer Check Regression

on:
  push:
    paths:
      - '.github/workflows/answer-check-regression.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run 12 production checks
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, pathlib, time
          endpoint='https://vhssshjcrirsuiijolwq.supabase.co/functions/v1/answer-check-scan'
          cases={
          '01':('Что делать с уведомлением о задолженности по ЖКХ?','У вас задолженность 14 820,35 руб. Реакция нужна в течение 10 календарных дней с момента получения: можно оплатить или направить возражения. Есть приложение-расчёт. Также уже начислена пеня 10%, её обязательно оплатить вместе с долгом.','important'),
          '02':('Что изменится по банковскому тарифу?','С 1 октября 2026 обслуживание увеличится с 199 до 299 рублей. До этой даты можно отказаться. Одновременно банк повышает процентную ставку по кредиту, поэтому кредитный платёж тоже вырастет.','important'),
          '03':('Какие условия договора услуг?','Цена 96 000: 48 000 аванс и 48 000 после выполнения. Срок 30 дней от аванса, материалы за 5 дней, замечания к акту 5 рабочих дней, неустойка 0,1% в день максимум 10%, расторжение за 10 дней. Также есть гарантия 5 лет и исключительная подсудность арбитражному суду Москвы.','high_stakes'),
          '04':('Что важно в аренде квартиры?','Срок 11 месяцев, аренда 55 000, депозит 55 000, оплата до 5 числа, выход с уведомлением за 30 дней. Животные могут стоить всего депозита. Плата автоматически индексируется на 10% каждые три месяца.','high_stakes'),
          '05':('Что видно из коммунальной квитанции?','Итого 7 608 рублей, оплатить до 20 сентября 2026. Перерасчёт минус 430,50, старого долга нет. Уже начислена пеня, поэтому фактически нужно платить больше 7 608 рублей.','important'),
          '06':('Что требует госорган?','До 25 сентября 2026 нужно пояснить расхождение и при наличии приложить подтверждающие документы. Это требование уплатить 32 000 рублей налога; если не заплатить, автоматически будет штраф.','high_stakes'),
          '07':('Что означает УЗИ?','Печень не увеличена, эхогенность умеренно повышена, очагов нет, камней не видно. Это установленный жировой гепатоз второй степени. Нужно сразу принимать гепатопротекторы, врач не нужен.','high_stakes'),
          '08':('Что означают анализы?','Глюкоза 6,4, холестерин 6,2 и ЛПНП 4,1 выше референсов; остальные показатели в референсе. Это точно диабет, поэтому нужно начать статины без консультации.','high_stakes'),
          '09':('Что важно в инструкции очистителя?','FILTER появляется после 2000 часов, после замены удерживать MODE 5 секунд, держать 20 см от стены, при запахе гари отключить. HEPA можно мыть водой раз в месяц.','important'),
          '10':('Почему страховая отказала?','Отказ по пункту 4.3: в акте 2 сентября нет внешних повреждений. Можно дать дополнительные документы. Обжалование строго 10 дней, после него выплата гарантирована.','high_stakes'),
          '11':('Обязан ли я доплатить сервису?','Просят 18 500 за натяжитель, работы ещё не выполнены, согласие просят письмом. Вы юридически обязаны доплатить, иначе полностью теряете гарантию.','high_stakes'),
          '12':('Что меняет допсоглашение?','Срок переносится с 10 на 30 сентября, цена 420 000 не меняется, будущая неустойка после 30 сентября. Подписание автоматически прощает всю уже возникшую неустойку до подписания.','high_stakes')}
          results=[]
          for cid,(q,a,m) in cases.items():
              body=json.dumps({'original_question':q,'answer_text':a,'mode':m},ensure_ascii=False).encode()
              req=urllib.request.Request(endpoint,data=body,method='POST',headers={'Content-Type':'application/json','Origin':'https://srumyantsev.ru','User-Agent':'answer-check-regression-'+cid})
              try:
                  with urllib.request.urlopen(req,timeout=90) as r:
                      payload=json.loads(r.read().decode('utf-8'))
                      results.append({'case':cid,'status':r.status,'payload':payload})
                      print(cid,r.status,json.dumps(payload,ensure_ascii=False))
              except Exception as e:
                  results.append({'case':cid,'status':'error','error':repr(e)})
                  print(cid,'ERROR',repr(e))
              time.sleep(1)
          pathlib.Path('answer-check-regression-results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: answer-check-regression-results
          path: answer-check-regression-results.json
          retention-days: 7
