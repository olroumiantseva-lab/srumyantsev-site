name: SEO trust AI update
on:
  push:
    branches: [seo-trust-ai]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-trust-ai
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/seo-trust-ai.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chto-nelzya-doveryat-neyroseti/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Усилить SEO гайда о доверии к нейросети'
          git push origin seo-trust-ai
