name: SEO letter query update
on:
  push:
    branches: [seo-letter-query]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-letter-query
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply query-led SEO update
        run: python .github/scripts/seo-letter-query-patch.py
      - name: Commit updated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kak-obyasnit-neponyatnoe-pismo-s-pomoshchyu-ii/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Усилить SEO гайда о непонятном письме"
          git push origin seo-letter-query
