name: SEO chat history update
on:
  push:
    branches: [seo-chat-history]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-chat-history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply query-led SEO update
        run: python .github/scripts/seo-chat-history-patch.py
      - name: Commit updated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kak-ne-poteryat-perepiski-s-ii/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Усилить SEO гайда о сохранении переписок"
          git push origin seo-chat-history
