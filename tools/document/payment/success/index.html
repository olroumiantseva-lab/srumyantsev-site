<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Оплата принята</title><link rel="stylesheet" href="/tools/assets/document.css"></head>
<body><header class="site-header"><div class="shell header-inner"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">＊</span><span>ОПЛАТА<br>ПРИНЯТА</span></a><span class="prototype-label">Оплата</span></div></header>
<main><section class="narrow"><div class="notice success"><h1 style="font-size:clamp(34px,6vw,54px)">Оплата принята</h1><p id="success-status">Открываем оплаченный результат…</p><p id="success-fallback" style="display:none"><a class="button" href="/">Вернуться на сайт</a></p></div></section></main>
<footer class="site-footer"><div class="shell footer-inner"><p>© 2026 ИП Румянцев Сергей Сергеевич</p><a href="/">На главную</a></div></footer>
<script>
(async () => {
  const p = new URLSearchParams(location.search);
  const invId = p.get('InvId');
  const status = document.getElementById('success-status');
  const fallback = document.getElementById('success-fallback');

  const routeAnswerCheck = () => {
    const target = new URL('https://vhssshjcrirsuiijolwq.supabase.co/functions/v1/answer-check-success-access');
    for (const [key, value] of p.entries()) target.searchParams.append(key, value);
    location.replace(target.toString());
  };

  if (p.get('Shp_site') === 'proverjdo' && invId && /^\d+$/.test(invId)) {
    location.replace(`/proverjdo/result/?InvId=${encodeURIComponent(invId)}`);
    return;
  }

  if (p.get('Shp_product') === 'answer_check_290' && invId && /^\d+$/.test(invId)) {
    routeAnswerCheck();
    return;
  }

  if (invId && /^\d+$/.test(invId)) {
    try {
      const r = await fetch(`https://vhssshjcrirsuiijolwq.supabase.co/functions/v1/payment-success-route?InvId=${encodeURIComponent(invId)}`, {headers:{Accept:'application/json'}, cache:'no-store'});
      const data = await r.json();
      if (r.ok && data?.product_id === 'answer_check_290') {
        routeAnswerCheck();
        return;
      }
      if (r.ok && data?.product_id === 'document_explain_290') {
        status.textContent = 'Оплата разбора документа подтверждена.';
        fallback.style.display = 'block';
        fallback.querySelector('a').href = '/tools/login/?return_to=%2Ftools%2Fdocument%2Fapp%2F';
        fallback.querySelector('a').textContent = 'Перейти к документу';
        return;
      }
    } catch {}
  }

  status.textContent = 'Оплата принята, но не удалось определить оплаченный продукт автоматически.';
  fallback.style.display = 'block';
})();
</script></body></html>
