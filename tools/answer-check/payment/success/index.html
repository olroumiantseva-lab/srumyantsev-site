<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Оплата принята — Проверка ответа</title>
  <link rel="stylesheet" href="/tools/assets/document.css">
</head>
<body>
<header class="site-header"><div class="shell header-inner"><a class="brand" href="/tools/answer-check/"><span class="brand-mark" aria-hidden="true">＊</span><span>ПРОВЕРКА<br>ОТВЕТА</span></a><span class="prototype-label">Оплата</span></div></header>
<main><section class="narrow"><div class="notice success"><h1 style="font-size:clamp(34px,6vw,54px)">Оплата принята</h1><p>Полная проверка ответа оплачена.</p><p>Открываем защищённый результат…</p><a class="button" id="answer-login-link" href="/tools/answer-check/">Вернуться к проверке</a></div></section></main>
<footer class="site-footer"><div class="shell footer-inner"><p>© 2026 ИП Румянцев Сергей Сергеевич</p><a href="/tools/answer-check/">На страницу сервиса</a></div></footer>
<script>
(() => {
  const p = new URLSearchParams(location.search);
  const invId = p.get('InvId');
  const link = document.getElementById('answer-login-link');
  if (!invId || !/^\d+$/.test(invId)) {
    link.href = '/tools/answer-check/';
    link.textContent = 'Вернуться к проверке';
    return;
  }

  // Legacy success page: hand the signed Robokassa return to the current
  link.textContent = 'Открываем полный результат…';
  link.removeAttribute('href');
  const target = new URL('https://vhssshjcrirsuiijolwq.supabase.co/functions/v1/answer-check-success-access');
  for (const [key, value] of p.entries()) target.searchParams.append(key, value);
  location.replace(target.toString());
})();
</script>
</body></html>
