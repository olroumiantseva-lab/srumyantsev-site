<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Оплата принята — Проверка ответа</title>
  <link rel="stylesheet" href="/tools/assets/document.css">
</head>
<body>
<header class="site-header"><div class="shell header-inner"><a class="brand" href="/tools/answer-check/"><span class="brand-mark" aria-hidden="true">＊</span><span>ПРОВЕРКА<br>ОТВЕТА</span></a><span class="prototype-label">Оплата</span></div></header>
<main><section class="narrow"><div class="notice success"><h1 style="font-size:clamp(34px,6vw,54px)">Оплата принята</h1><p>Полная проверка ответа оплачена и привязана к электронной почте, указанной при оплате.</p><p>Войдите по одноразовой ссылке из письма. Пароль придумывать не нужно.</p><a class="button" id="answer-login-link" href="/tools/login/">Открыть полный результат</a></div></section></main>
<footer class="site-footer"><div class="shell footer-inner"><p>© 2026 ИП Румянцев Сергей Сергеевич</p><a href="/tools/answer-check/">На страницу сервиса</a></div></footer>
<script>
(() => {
  const p = new URLSearchParams(location.search);
  const invId = p.get('InvId');
  const link = document.getElementById('answer-login-link');
  if (!invId || !/^\d+$/.test(invId)) {
    link.href = '/tools/answer-check/';
    link.textContent = 'Вернуться к проверке';
    return;
  }
  const returnTo = `/tools/answer-check/result/?InvId=${encodeURIComponent(invId)}`;
  link.href = `/tools/login/?return_to=${encodeURIComponent(returnTo)}`;

  const METRIKA_ID = 111385663;
  if (typeof window.ym !== 'function') {
    window.ym = function () { (window.ym.a = window.ym.a || []).push(arguments); };
    window.ym.l = Date.now();
    const script = document.createElement('script');
    script.async = true;
    script.src = 'https://mc.yandex.ru/metrika/tag.js';
    document.head.appendChild(script);
    window.ym(METRIKA_ID, 'init', { clickmap: true, trackLinks: true, accurateTrackBounce: true });
  }
  let tracked = false;
  const key = `ded.answer_check.payment_success.${invId}`;
  try {
    tracked = sessionStorage.getItem(key) === '1';
    if (!tracked) sessionStorage.setItem(key, '1');
  } catch {}
  if (!tracked) window.ym(METRIKA_ID, 'reachGoal', 'answer_check_payment_success', { product: 'answer_check_290', inv_id: invId, value_rub: 19 });
})();
</script>
</body></html>
